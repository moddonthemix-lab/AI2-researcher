[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar"
version = "0.1.0"
description = "Scholar — the Researcher of the AI family: a local, private research analyst that cites its sources."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # core runs on the standard library + Ollama

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
scholar = "scholar.cli:main"

[tool.setuptools]
packages = ["scholar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
